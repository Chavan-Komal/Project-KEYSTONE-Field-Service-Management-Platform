[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the live Render backend — must come before the SPA
# catch-all below, since Netlify redirects match in order, first wins.
[[redirects]]
  from = "/api/*"
  to = "https://keystone-backend-nkul.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing (react-router) — any deep link (e.g. /board, /work-orders/123)
# must still serve index.html so the SPA's own router can take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
